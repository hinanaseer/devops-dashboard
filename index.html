<!DOCTYPE html>
<html>
<head>
    <title>DevOps Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #111827;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
        }

        .container {
            width: 70%;
            margin: auto;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: #1f2937;
            padding: 30px;
            border-radius: 10px;
            width: 180px;
        }

        .status {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DevOps Status Dashboard</h1>

    <p>CI/CD Deployment Project</p>

    <div class="cards">

        <div class="card">
            <h3>GitHub</h3>
            <p class="status">Connected</p>
        </div>

        <div class="card">
            <h3>Jenkins</h3>
            <p class="status">Running</p>
        </div>

        <div class="card">
            <h3>Docker</h3>
            <p class="status">Running</p>
        </div>

        <div class="card">
            <h3>AWS</h3>
            <p class="status">Deployed</p>
        </div>

    </div>

    <h2>Version 1.0</h2>

</div>

</body>
</html>
